[project]
name = "cybercare-events"
version = "0.1.0"
description = "Event propagator and event consumer services"
requires-python = ">=3.12"
dependencies = ["pydantic (>=2.14.4,<3.0.0)", "pymongo (>=4.20.2,<5.0.0)", "fastapi (>=0.165.0,<0.166.0)", "uvicorn (>=0.54.0,<0.55.0)"]

[tool.poetry]
packages = [{ include = "consumer" }, { include = "propagator" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
testcontainers = {extras = ["mongodb"], version = "^4.15.0"}
httpx = "^0.29.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
